<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - CreateWeb</title>

    <!-- OG标签 -->
    <meta property="og:title" content="{{ .Title }} - 我的个人博客">
    <meta property="og:description" content="神人">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ .Site.BaseURL }}/images/og-image1.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ .Title }} - 我的个人博客">
    <meta name="twitter:description" content="这里写你的博客简介">
    <meta name="twitter:image" content="{{ .Site.BaseURL }}images/og-image1.png">

    <!-- Favicon -->
    <link rel="icon" href="{{ .Site.BaseURL }}/images/favicon.ico">
    <link rel="shortcut icon" href="{{ .Site.BaseURL }}images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ .Site.BaseURL }}images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ .Site.BaseURL }}images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ .Site.BaseURL }}images/favicon-16x16.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            padding: 0 !important;
            margin: 0 !important;
        }

        body {
            min-height: 100vh;
            color: #ff6b81;
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 背景图 */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: url("{{ .Site.BaseURL }}/images/background.jpg") no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            pointer-events: none;
        }

        /* 星星粒子 */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Banner */
        .banner {
            line-height: 0;
            width: 100vw !important;
            max-width: 100vw !important;
            margin: 0 !important;
            padding: 0 !important;
            position: relative !important;
            left: 0 !important;
            transform: none !important;
            float: none !important;
            clear: both !important;
        }

        .banner img {
            width: 100% !important;
            max-width: 100% !important;
            height: auto !important;
            border-radius: 0 !important;
            display: block !important;
            object-fit: cover !important;
        }

        /* 导航栏 */
        .nav {
            background: #b5bef3;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .nav a:hover {
            color: #5a67d8;
            transform: scale(1.05);
        }

        /* 主体 */
        .main {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .main h1 {
            color: #ff4757;
            margin-bottom: 20px;
            text-align: center;
        }

        .main p {
            margin-bottom: 15px;
        }

        /* 最新内容 */
        .recent-posts {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        .recent-posts li {
            margin-bottom: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.45);
            border-radius: 12px;
            transition: all 0.2s ease;
            backdrop-filter: blur(2px);
        }

        .recent-posts li:hover {
            background: rgba(255,255,255,0.75);
            transform: translateX(4px);
        }

        .recent-posts a {
            color: #ff5c8a;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .recent-posts a:hover {
            color: #ff2e63;
        }

        .recent-posts small {
            display: block;
            color: #777;
            margin-top: 5px;
            font-size: 13px;
        }

        /* 声明 */
        .statement {
            margin-top: 40px;
            opacity: 0.85;
            font-size: 14px;
        }

        /* 分隔线 */
        hr {
            border: none;
            border-top: 2px dashed rgba(255, 107, 129, 0.4);
            margin: 30px 0;
        }

        h2 {
            color: #ff4f7b;
            margin-bottom: 15px;
        }

        /* 移动端 */
        @media (max-width: 768px) {
            .nav a {
                font-size: 16px;
                margin: 0 8px;
            }

            .main {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- 背景 -->
    <div class="bg-container"></div>

    <!-- 星星 -->
    <canvas id="stars-canvas"></canvas>

    <!-- Banner -->
    <div class="banner">
        <img src="{{ .Site.BaseURL }}/images/banner.jpg" alt="博客banner">
    </div>

    <!-- 导航 -->
    <div class="nav">
    <a href="{{ .Site.BaseURL }}">首页</a >
    <a href="{{ .Site.BaseURL }}diary/">日记</a >
    <a href="{{ .Site.BaseURL }}art/">绘图</a >
    <a href="{{ .Site.BaseURL }}about/">关于我</a >
</div>

    <!-- 访问统计 -->
    <p style="text-align:center; margin-top:10px;">
        👀 总访问量:
        <span id="busuanzi_value_site_pv"></span>

        |

        👤 总访客数:
        <span id="busuanzi_value_site_uv"></span>
    </p >

    <!-- 页面内容 -->
    <div class="main">
        {{ block "main" . }}{{ end }}
    </div>

    <!-- 星星脚本 -->
    <script>
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 6 + 2;
                this.speedY = Math.random() * 2 + 1;
                this.speedX = Math.random() - 0.5;

                this.colors = [
                    '#ff6b81',
                    '#ff8fa3',
                    '#ffc2d1',
                    '#ff4757',
                    '#70e1f5',
                    '#ffd166',
                    '#06d6a0',
                    '#118ab2'
                ];

                this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
                this.alpha = Math.random() * 0.4 + 0.6;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                if (this.y > canvas.height) {
                    this.y = 0 - this.size;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.save();

                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;

                ctx.translate(this.x, this.y);
                ctx.rotate(Math.random() * Math.PI * 2);

                ctx.beginPath();

                for (let i = 0; i < 5; i++) {
                    ctx.lineTo(
                        Math.cos((i * 144 * Math.PI / 180)) * this.size,
                        Math.sin((i * 144 * Math.PI / 180)) * this.size
                    );

                    ctx.lineTo(
                        Math.cos(((i * 144 + 72) * Math.PI / 180)) * this.size / 2.5,
                        Math.sin(((i * 144 + 72) * Math.PI / 180)) * this.size / 2.5
                    );
                }

                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        const stars = [];
        const starCount = 80;

        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>

    <!-- 不蒜子统计 -->
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

</body>
</html>
